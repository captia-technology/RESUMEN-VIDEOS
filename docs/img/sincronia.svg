<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="Desfase de audio antes y después de los arreglos">
<title>Desfase de audio antes y después de los arreglos</title>
<rect width="620" height="300" fill="#0B1220"/>
<rect x="20" y="20" width="580" height="260" rx="14" fill="#0D1626" stroke="#1E293B" stroke-width="1"/>
<text x="40" y="58" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#E2E8F0" font-weight="700" text-anchor="start">Desfase de audio acumulado</text>
<text x="40" y="80" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">20 uniones, vídeo sintético de 12 s</text>
<text x="196" y="125" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="500" text-anchor="end">Primera versión</text>
<rect x="210" y="110" width="148.8" height="22" rx="6" fill="#F87171" opacity=".9"/>
<text x="368.8" y="126" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#F87171" font-weight="700" text-anchor="start">93 ms</text>
<text x="196" y="171" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="500" text-anchor="end">Audio codificado una vez</text>
<rect x="210" y="156" width="8.0" height="22" rx="6" fill="#FBBF24" opacity=".9"/>
<text x="228.0" y="172" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#FBBF24" font-weight="700" text-anchor="start">5 ms</text>
<text x="196" y="217" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="500" text-anchor="end">Versión final</text>
<rect x="210" y="202" width="3.0" height="22" rx="6" fill="#34D399" opacity=".9"/>
<text x="223.0" y="218" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#34D399" font-weight="700" text-anchor="start">0 ms</text>
<text x="40" y="268" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">Medido como diferencia entre la duración del vídeo y la del audio decodificado.</text>
</svg>
